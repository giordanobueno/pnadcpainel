name: R-CMD-check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::lintr
            any::withr
            any::testthat

      - name: Run R CMD check
        run: |
          rcmdcheck::rcmdcheck(args = c("--as-cran", "--no-manual", "--no-vignettes"), error_on = "warning")
        shell: Rscript {0}

      - name: Run testthat suite
        run: |
          devtools::test(reporter = "summary")
        shell: Rscript {0}

      - name: Run lintr
        run: |
          lints <- lintr::lint_package()
          print(lints)
          if (length(lints) > 0) stop("Lint errors found.")
        shell: Rscript {0}
